name: Full Sync

on:
  workflow_dispatch:
    inputs:
      binvern:
        description: '指定Zig版本号(如0.15.2,不填则使用最新版本)'
        required: false
        type: string
  #schedule:
  #  - cron: '0 2 * * *'  # 每天凌晨2点自动执行(使用最新版本)

permissions:
  contents: write

jobs:
  sync_binaries:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 下载Zig指定版本的全部二进制包
        id: get_files
        run: |
          # 设置错误退出
          set -e

          get_files_and_export_envs() {
            # 定义下载源
            URL="https://ziglang.org/download/index.json"

            # 创建临时文件和目录
            TJN="tmp.json"
            mkdir -p dist

            # 下载版本信息
            echo "正在获取Zig版本信息..."
            if ! curl -4fsLo "${TJN}" "${URL}"; then
              echo "错误: 无法获取版本信息"
              exit 1
            fi

            # 验证JSON文件是否有效
            if ! jq -e . < "${TJN}" > /dev/null 2>&1; then
              echo "错误: 获取的版本信息不是有效的JSON"
              exit 1
            fi

            # 解析版本信息
            vnstr=${{ github.event.inputs.binvern }}
            patxx=""

            if [ -n "${vnstr}" ]; then
              # 使用指定的版本
              patxx=".\"${vnstr}\""
              echo "使用指定版本: ${vnstr}"
            else
              # 使用最新的稳定版本
              # 查找最大的版本号
              latest_version=$(jq -r 'keys[]' < "${TJN}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -Vr | head -n 1)

              if [ -z "${latest_version}" ]; then
                echo "错误: 无法找到最新版本"
                exit 1
              fi

              vnstr=${latest_version}
              patxx=".\"${vnstr}\""
              echo "使用最新版本: ${vnstr}"
            fi

            # 提取所有下载链接
            echo "正在提取下载链接..."
            download_links=()
            while IFS= read -r link; do
              if [[ -n "${link}" ]]; then
                download_links+=("${link}")
              fi
            done < <(jq -r "${patxx}" < "${TJN}" | grep -E '"tarball":' | sed -r 's#^\s+"tarball": "(https?://.*)",?$#\1#')

            if [ ${#download_links[@]} -eq 0 ]; then
              echo "错误: 未找到下载链接"
              exit 1
            fi

            echo "找到 ${#download_links[@]} 个下载链接"

            # 并行下载文件
            echo "开始并行下载..."
            local download_errors=0

            for link in "${download_links[@]}"; do
              local filename="${link##*/}"
              local output_path="dist/${filename}"

              (echo "下载: ${link}"
              if curl -4fLo "${output_path}" "${link}"; then
                echo "成功: ${filename}"
              else
                echo "失败: ${filename}"
                download_errors=$((download_errors+1))
              fi
              ) &
            done

            # 等待所有下载完成
            wait

            if [ ${download_errors} -gt 0 ]; then
              echo "错误: 有 ${download_errors} 个文件下载失败"
              exit 1
            fi

            echo "所有文件下载完成"

            # 清理临时文件
            rm -f "${TJN}"

            # 设置环境变量
            echo "VNSTR=${vnstr}" >> "${GITHUB_ENV}"
            echo "BSURL=${URL%/index.json}" >> "${GITHUB_ENV}"
            echo "DOWNLOAD_COUNT=${#download_links[@]}" >> "${GITHUB_ENV}"
          }

          # 执行下载函数
          get_files_and_export_envs

      - name: 验证下载结果
        id: verify_download
        run: |
          if [ ! -d "dist" ]; then
            echo "错误: dist目录不存在"
            exit 1
          fi

          file_count=$(ls -la dist/ | grep -v "^total" | grep -v "^\." | wc -l)
          if [ ${file_count} -eq 0 ]; then
            echo "错误: dist目录为空,没有下载任何文件"
            exit 1
          fi

          echo "成功下载 ${file_count} 个文件"
          echo "文件列表:"
          ls -la dist/

      - name: 发布到Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: "v${{ env.VNSTR }}"  # 用版本号作为tag(如v0.12.0)
          name: "Zig v${{ env.VNSTR }} Binaries"
          body: |
            自动同步自Zig官网的二进制程序
            - 版本: ${{ env.VNSTR }}
            - 官网下载地址: ${{ env.BSURL }}/${{ env.VNSTR }}
            - 下载文件数量: ${{ env.DOWNLOAD_COUNT }}
            - 同步时间: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          overwrite: true  # 覆盖已有版本,确保使用最新版本

      - name: 清理临时文件
        if: always()
        run: |
          rm -rf dist/ tmp.json
          echo "清理完成"
